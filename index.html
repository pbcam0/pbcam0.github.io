<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paul Campbell — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="site-name">Alex Morgan</a>
      <nav id="tab-nav" class="tab-nav" aria-label="Main navigation"></nav>
    </div>
  </header>

  <main id="tab-content" class="tab-content"></main>

  <!-- Lightbox (managed by photos.js) -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev"  id="lb-prev"  aria-label="Previous">&#8592;</button>
    <button class="lb-next"  id="lb-next"  aria-label="Next">&#8594;</button>
    <figure class="lb-figure">
      <img id="lb-img" src="" alt="" />
      <figcaption id="lb-caption"></figcaption>
    </figure>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
