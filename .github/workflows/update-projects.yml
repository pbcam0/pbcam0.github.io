name: Update Projects

on:
  schedule:
    - cron: '0 2 * * *'  # runs nightly at 2am
  workflow_dispatch:       # lets you trigger it manually too

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Take screenshots and update projects-data.json
        run: |
          node -e "
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function run() {
            const projects = JSON.parse(fs.readFileSync('data/projects-data.json', 'utf8'));
            const browser = await chromium.launch();

            fs.mkdirSync('screenshots', { recursive: true });

            for (const project of projects) {
              const slug = project.link
                .replace(/https?:\/\//, '')
                .replace(/[^a-z0-9]/gi, '-')
                .toLowerCase();
              const filename = 'screenshots/' + slug + '.png';

              const page = await browser.newPage();
              await page.setViewportSize({ width: 1280, height: 800 });
              await page.goto(project.link, { waitUntil: 'networkidle' });
              await page.screenshot({ path: filename });
              await page.close();

              project.screenshot = filename;
            }

            await browser.close();
            fs.writeFileSync('data/projects-data.json', JSON.stringify(projects, null, 2));
            console.log('Done');
          }

          run();
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add screenshots/ data/projects-data.json
          git diff --staged --quiet || git commit -m "Auto-update screenshots"
          git push